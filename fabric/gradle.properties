# Gradle 自身 JVM：Xmx + UTF-8。本机环境直连可达 maven.fabricmc.net，无需代理；如日后走代理再加 -Dhttp.proxyHost 等
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Dhttp.nonProxyHosts=localhost|127.0.0.1
org.gradle.parallel=true
org.gradle.daemon=false

# JDK 定位（本机 17 装在非标准路径，显式告诉 Gradle）
org.gradle.java.installations.paths=C:/Program Files (x86)/Android/openjdk/jdk-17.0.14

# Fabric
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.10
fabric_version=0.92.2+1.20.1

# Mod
mod_version=1.0.0
maven_group=com.aicompanion
archives_base_name=ai-companion
